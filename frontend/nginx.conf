# HTTPS only. Microsoft Entra ID accepts only https:// redirect
# addresses away from localhost, and staff sign in and upload
# photographs through this server, so nothing is served in the clear:
# there is no port 80 listener at all.
#
# The certificate and key are mounted from the host (compose.yaml,
# TLS_CERT_DIR) as tls.crt - the server certificate followed by any
# intermediate certificates - and tls.key. nginx refuses to start if
# either is missing, which is the intended failure.
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  root /usr/share/nginx/html;
  index index.html;

  # Ten observation photographs at 10 MB each, plus multipart overhead;
  # nginx defaults to 1 MB and would reject the upload with a 413 before
  # it reached the API.
  client_max_body_size 110m;

  # Docker's internal DNS. Resolving "backend" per request means a
  # recreated backend container is picked up without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # This is the only proxy in front of the API, which is what the
  # backend's "trust proxy 1" assumes: the address it rate-limits on is
  # the browser's own, taken from X-Forwarded-For as set here. The API's
  # own responses carry helmet's Strict-Transport-Security header.
  location /api/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ten photographs are compressed (two uploads at a time server-wide)
    # and, with SharePoint storage, uploaded before the API answers; at
    # a shift change that can outlast nginx's 60 s default.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # A location with its own add_header inherits none from the server
  # block, so Strict-Transport-Security is repeated in each.

  # Vite emits hashed bundles, so they can be cached hard.
  location /assets/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: deep links serve index.html and React Router takes over.
  location / {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
