server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Observation photographs are up to 10 MB; nginx defaults to 1 MB and
  # would reject the upload with a 413 before it reached the API.
  client_max_body_size 12m;

  # Docker's internal DNS. Resolving "backend" per request means a
  # recreated backend container is picked up without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite emits hashed bundles, so they can be cached hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: deep links serve index.html and React Router takes over.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
