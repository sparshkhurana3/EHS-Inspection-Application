services:
  postgres:
    image: postgres:16
    container_name: ehs_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ehs_inspection
      POSTGRES_USER: ehs_app
      POSTGRES_PASSWORD: replace_with_secure_password

    ports:
      - "5432:5432"

    volumes:
      - ehs_postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ehs_app -d ehs_inspection"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ehs_postgres_data: